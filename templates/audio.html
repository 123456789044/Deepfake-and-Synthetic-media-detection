<!DOCTYPE html>
<html>
<head>
    <title>Audio Detection</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<div class="container mt-5">

    <h2 class="text-center text-white">
        <i class="bi bi-mic-fill text-warning"></i>
        Audio Synthetic Detection
    </h2>

    <div class="card upload-card mt-4 mx-auto p-4">

        <!-- Upload Audio -->
        <input type="file"
               id="audioInput"
               class="form-control mb-3"
               accept="audio/*">

        <!-- Analyze Button -->
        <div class="d-grid">
            <button class="btn btn-warning" onclick="detectAudio()">
                <i class="bi bi-soundwave"></i> Analyze Audio
            </button>
        </div>

        <!-- Audio Preview -->
        <div class="mt-4 text-center">
            <audio id="previewAudio"
                   controls
                   style="display:none; width:100%;">
            </audio>
        </div>

        <!-- Result Section (Hidden Initially) -->
        <div id="resultSection"
             class="result-box text-center mt-4"
             style="display:none;">

            <h5>Result:
                <span id="resultText" class="fw-bold"></span>
            </h5>

            <div class="progress mt-3">
                <div id="confidenceBar"
                     class="progress-bar">
                </div>
            </div>

        </div>

    </div>

    <!-- Back Button -->
    <div class="text-center mt-4">
        <a href="/" class="btn btn-light">
            <i class="bi bi-arrow-left-circle"></i> Back to Home
        </a>
    </div>

</div>

<script>

async function detectAudio() {

    let fileInput = document.getElementById("audioInput");
    let preview = document.getElementById("previewAudio");

    if (fileInput.files.length === 0) {
        alert("Please upload an audio file first!");
        return;
    }

    let file = fileInput.files[0];

    // Show audio preview
    preview.src = URL.createObjectURL(file);
    preview.style.display = "block";

    // Create form data
    let formData = new FormData();
    formData.append("file", file);

    // Show loading text
    document.getElementById("resultSection").style.display = "block";
    document.getElementById("resultText").innerText = "Analyzing...";
    
    try {

        let response = await fetch("/predict_audio", {
            method: "POST",
            body: formData
        });

        let data = await response.json();

        let result = data.result;

        let bar = document.getElementById("confidenceBar");

        // Display result
        document.getElementById("resultText").innerText = result;

        if(result.includes("Fake") || result.includes("Synthetic")){
            document.getElementById("resultText").className = "text-danger fw-bold";
            bar.style.width = "90%";
            bar.innerText = "High Fake Probability";
            bar.className = "progress-bar bg-danger";
        }
        else{
            document.getElementById("resultText").className = "text-success fw-bold";
            bar.style.width = "90%";
            bar.innerText = "High Real Probability";
            bar.className = "progress-bar bg-success";
        }

    }
    catch(error){
        document.getElementById("resultText").innerText = "Error detecting audio";
    }

}

</script>
</body>
</html>
