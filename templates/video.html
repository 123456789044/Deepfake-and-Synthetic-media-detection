<html>
<head>
    <title>Video Detection</title>

</head>

<body>

<div class="container mt-5">

```
<h2 class="text-center text-white">
    <i class="bi bi-camera-video-fill text-success"></i>
    Video Deepfake Detection
</h2>

<div class="card upload-card mt-4 mx-auto p-4">

    <!-- Upload Video -->
    <input type="file"
           id="videoInput"
           class="form-control mb-3"
           accept="video/*">

    <!-- Analyze Button -->
    <div class="d-grid">
        <button class="btn btn-success" onclick="detectVideo()">
            <i class="bi bi-play-circle"></i> Analyze Video
        </button>
    </div>

    <!-- Video Preview -->
    <div class="text-center mt-4">
        <video id="previewVideo"
               controls
               class="w-100 mt-3"
               style="display:none; max-height:350px;">
        </video>
    </div>

    <!-- Result Section -->
    <div id="resultSection"
         class="result-box text-center mt-4"
         style="display:none;">

        <h5>
            Result:
            <span id="resultText" class="fw-bold"></span>
        </h5>

        <div class="progress mt-3">
            <div id="confidenceBar"
                 class="progress-bar"
                 style="width:0%">
            </div>
        </div>

    </div>

</div>

<!-- Back Button -->
<div class="text-center mt-4">
    <a href="/" class="btn btn-light">
        <i class="bi bi-arrow-left-circle"></i> Back to Home
    </a>
</div>
```

</div>

<script>

async function detectVideo() {

    let fileInput = document.getElementById("videoInput");
    let preview = document.getElementById("previewVideo");

    if (fileInput.files.length === 0) {
        alert("Please upload a video first!");
        return;
    }

    let file = fileInput.files[0];

    // Show preview
    preview.src = URL.createObjectURL(file);
    preview.style.display = "block";

    // Prepare form data
    let formData = new FormData();
    formData.append("file", file);

    // Show loading state
    document.getElementById("resultSection").style.display = "block";
    document.getElementById("resultText").innerText = "Analyzing video...";

    let bar = document.getElementById("confidenceBar");
    bar.style.width = "40%";
    bar.innerText = "Processing...";
    bar.className = "progress-bar bg-warning";

    try {

        let response = await fetch("/predict_media", {
            method: "POST",
            body: formData
        });

        let data = await response.json();
        let result = data.result;

        document.getElementById("resultText").innerText = result;

        if(result.toLowerCase().includes("fake")){
            document.getElementById("resultText").className = "text-danger fw-bold";

            bar.style.width = "90%";
            bar.innerText = "High Fake Probability";
            bar.className = "progress-bar bg-danger";
        }
        else{
            document.getElementById("resultText").className = "text-success fw-bold";

            bar.style.width = "90%";
            bar.innerText = "High Real Probability";
            bar.className = "progress-bar bg-success";
        }

    }
    catch(error){
        document.getElementById("resultText").innerText = "Error analyzing video";
        bar.style.width = "100%";
        bar.innerText = "Error";
        bar.className = "progress-bar bg-secondary";
    }

}

</script>

</body>
</html>
